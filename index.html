<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Review Builder - v6.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Foundation:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #f1f5f9; }
        .bento-box { background: white; border-radius: 16px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); border: 1px solid #e2e8f0; }
        .drag-ghost { opacity: 0.4; background-color: #eff6ff; border: 2px dashed #3b82f6; }
        .drag-chosen { background-color: #f8fafc; transform: scale(1.02); transition: all 0.2s; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .timeline-item.active { border: 2px solid #3b82f6; background-color: #eff6ff; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .edu-font { font-family: 'Edu NSW ACT Foundation', cursive; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">

    <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shrink-0 z-10 relative shadow-sm">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white p-2 rounded-lg"><i class="fa-solid fa-layer-group"></i></div>
            <h1 class="text-xl font-bold text-slate-800">Review<span class="text-blue-600">Builder</span> <span class="text-xs text-slate-400 font-normal ml-2">v6.7</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <button id="btn-open-folder-header" class="bg-blue-50 hover:bg-blue-100 text-blue-700 px-4 py-2 rounded-xl font-bold transition-colors shadow-sm flex items-center gap-2 border border-blue-200">
                <i class="fa-solid fa-folder-open"></i> Open Drive Folder
            </button>
            <button id="btn-assemble" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2 rounded-xl font-bold transition-colors shadow-md flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Assemble Deck
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden p-4 gap-4">
        
        <!-- Library Panel -->
        <div class="w-1/4 bento-box flex flex-col overflow-hidden">
            <div class="bg-slate-50 border-b border-slate-200 px-4 py-3 font-bold text-slate-700 flex justify-between items-center shrink-0">
                <span><i class="fa-solid fa-book-open text-blue-500 mr-2"></i> Section Library</span>
            </div>
            <div class="p-4 overflow-y-auto flex-1">
                <div id="library-list" class="flex flex-col gap-2">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <!-- Timeline Panel -->
        <div class="w-2/4 bento-box flex flex-col overflow-hidden bg-white border-2 border-blue-200 shadow-lg relative z-10">
            <div id="timeline-header" class="bg-slate-50 border-b border-blue-100 px-4 py-3 flex justify-between items-center shrink-0 cursor-pointer hover:bg-slate-100 transition-colors" title="Click to view Global Settings">
                <span class="font-bold text-slate-700"><i class="fa-solid fa-route text-emerald-500 mr-2"></i> Timeline: <span class="font-normal text-slate-500" id="timeline-filename">Term 1, Week 1 Review</span></span>
                <div class="flex items-center gap-2">
                    <button id="btn-add-all" class="text-xs font-semibold text-blue-600 hover:text-blue-700 flex items-center gap-1 bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded-md transition-colors border border-blue-100"><i class="fa-solid fa-list-check"></i> Include All</button>
                    <button id="btn-reset" class="text-xs font-semibold text-rose-500 hover:text-rose-600 flex items-center gap-1 bg-rose-50 hover:bg-rose-100 px-2 py-1 rounded-md transition-colors border border-rose-100"><i class="fa-solid fa-rotate-left"></i> Reset</button>
                </div>
            </div>
            <div class="p-4 overflow-y-auto flex-1 relative bg-slate-50/50" id="timeline-container">
                <div id="timeline-list" class="flex flex-col gap-3 min-h-[50vh] pb-20">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <!-- Inspector Panel -->
        <div class="w-1/4 bento-box flex flex-col overflow-hidden shadow-sm border-blue-100">
            <div id="inspector-header" class="bg-blue-50 border-b border-blue-100 px-4 py-3 font-bold text-blue-800 shrink-0 transition-colors">
                <i class="fa-solid fa-sliders mr-2"></i> <span id="inspector-title">Global Settings</span>
            </div>
            <div id="inspector-content" class="p-4 overflow-y-auto flex-1 bg-white relative">
                <!-- Populated by JS -->
            </div>
        </div>
    </main>

    <div id="json-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-8 opacity-0 transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl h-full max-h-[80vh] flex flex-col overflow-hidden transform scale-95 transition-transform" id="json-modal-content">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h2 class="font-bold text-lg text-slate-800"><i class="fa-solid fa-code text-blue-500 mr-2"></i> Assembly Recipe (JSON)</h2>
                <button id="btn-close-modal" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="flex-1 p-4 bg-slate-900 overflow-y-auto">
                <pre id="json-output" class="text-green-400 font-mono text-sm whitespace-pre-wrap break-words"></pre>
            </div>
            <div class="p-4 border-t border-slate-200 bg-slate-50 flex justify-between items-center">
                <button id="btn-open-folder-modal" class="text-blue-600 hover:text-blue-800 font-semibold text-sm flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-folder-open"></i> Open Destination Folder
                </button>
                <div class="flex items-center gap-4">
                    <span id="api-status" class="text-sm font-semibold text-slate-500 hidden">Sending...</span>
                    <button id="btn-send-api" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl font-semibold transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Send to Google Slides
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE ---
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSv0rkt0iPDpxwivv50h5wNOptx6ELvULyAkliPY6xbB7-XPhixAOU3qNJ0nSKvQ0/exec"; 
        
        let currentRecipe = null;

        const SOUNDS_WRITE_LEVELS = [
            "IC1 (a, i, m, s, t)",
            "IC2 (n, o, p)",
            "IC3 (b, c, g, h)",
            "IC4 (d, e, f, v)",
            "IC5 (k, l, r, u)",
            "IC6 (j, w, z)",
            "IC7 (x, y, ff, ll, ss, zz)",
            "IC11 (sh, ch, tch, th, ck, wh, ng, qu)"
        ];

        // Mapping graphemes for logic generator
        const phonicsData = {
            "IC1 (a, i, m, s, t)": ["a", "i", "m", "s", "t"],
            "IC2 (n, o, p)": ["n", "o", "p"],
            "IC3 (b, c, g, h)": ["b", "c", "g", "h"],
            "IC4 (d, e, f, v)": ["d", "e", "f", "v"],
            "IC5 (k, l, r, u)": ["k", "l", "r", "u"],
            "IC6 (j, w, z)": ["j", "w", "z"],
            "IC7 (x, y, ff, ll, ss, zz)": ["x", "y", "ff", "ll", "ss", "zz"],
            "IC11 (sh, ch, tch, th, ck, wh, ng, qu)": ["sh", "ch", "tch", "th", "ck", "wh", "ng", "qu"]
        };

        const SECTION_DEFS = {
            'mainIntro': { 
                title: 'Intro Slide', shortDesc: 'Introduction slide', icon: 'fa-door-open', color: 'text-purple-500', bg: 'bg-purple-100', type: 'static', runOnce: true,
                description: 'This slide appears once in the weekly deck, before the daily sets. It includes key information such as Term, Week, Class.' 
            },
            'expectations': { 
                title: 'General Instructions', shortDesc: 'Expectations and instructions', icon: 'fa-list-check', color: 'text-indigo-500', bg: 'bg-indigo-100', type: 'weekly',
                description: 'The reminder of Daily Review expectations. Options for use of whiteboards and transition music.',
                fields: [{ id: 'style', label: 'Style', type: 'select', options: ['Basic', 'Whiteboards', 'Whiteboards and Music'] }]
            },
            'dayDivider': { 
                title: 'Day of the Week', shortDesc: 'Day of the week - acts as a visual separator of each day\'s slide set.', icon: 'fa-calendar-day', color: 'text-pink-500', bg: 'bg-pink-100', type: 'static',
                description: 'A day of the week slide. Note this is also a visual divider to help you locate each day\'s slide set.'
            },
            'sectA': { 
                title: 'Talk About the Picture', shortDesc: 'Students talk about picture prompt.', icon: 'fa-image', color: 'text-blue-500', bg: 'bg-blue-100', type: 'daily', hasTitleSlideOptions: true,
                description: 'This section includes a picture placeholder for students to practise oral language. Pictures will be inserted in PowerPoint or Google Slides. Write prompts below, which will be inserted in the speakers notes section for reference.',
                fields: [{ id: 'prompt', label: 'Teacher Prompt', type: 'textarea' }]
            },
            'sectB': { 
                title: 'Say the Sound', shortDesc: 'Grapheme recognition', icon: 'fa-bolt', color: 'text-amber-500', bg: 'bg-amber-100', type: 'weekly', hasTitleSlideOptions: true,
                description: 'This section includes a single grapheme on each slide. Students can recite the phoneme. The pool of graphemes used will depend on the level set in Global Settings. There will be one slide per grapheme from the pool, unless you choose to restrict the number of slides below. The most recent phoneme set will always be included.',
                fields: [{ id: 'limit', label: 'Slide Limit (Optional)', type: 'number' }]
            },
            'sectC': { 
                title: 'Read the lines', shortDesc: 'Reading lines of graphemes', icon: 'fa-align-left', color: 'text-emerald-500', bg: 'bg-emerald-100', type: 'weekly', hasTitleSlideOptions: true,
                description: 'Two lines of graphemes based on your current phonics level. They will be randomised for each day of the week.',
                fields: []
            },
            'sectD': {
                title: 'Heart Words', shortDesc: 'High-frequency words', icon: 'fa-heart', color: 'text-red-500', bg: 'bg-red-100', type: 'mixed', hasTitleSlideOptions: true,
                description: 'This section includes slides with a single high frequency word (aka \'heart word\') on each slide. Students say the word. Include your set of heart words in the text box below, separated by commas. Optionally, the final heart word(s) can be on the "write it" slide for students to write on their whiteboards.',
                weeklyFields: [
                    { id: 'words', label: 'Heart Words (comma separated)', type: 'textarea', default: 'a, the, is, are, I, am, and, to, we, me, my, she, he, has, have, you, they, was, that, this, for' }
                ],
                dailyFields: [
                    { id: 'writeIt', label: 'Include "Write It" slide', type: 'checkbox' },
                    { id: 'writeItWords', label: 'Word(s) for Write It slide(s)', type: 'text' }
                ]
            },
            'sectE': {
                title: 'Read the Word', shortDesc: 'Say the sounds and read the word.', icon: 'fa-comment-dots', color: 'text-cyan-500', bg: 'bg-cyan-100', type: 'daily', hasTitleSlideOptions: true,
                description: 'This section shows a single word for students to decode. Write a few words below, comma separated. If the word is a "non-word" add an asterisk to use the alien word slide, e.g. hat, dog, fen*.',
                fields: [{ id: 'words', label: 'Words (comma separated)', type: 'text' }]
            },
            'sectF': {
                title: 'Discriminate the Similar Sounds', shortDesc: 'Build auditory discrimination, e.g. pen/pan', icon: 'fa-ear-listen', color: 'text-teal-500', bg: 'bg-teal-100', type: 'daily', hasTitleSlideOptions: true,
                description: 'This section shows minimal pairs (e.g. pen/pan) for students to practise hearing and saying commonly confused sounds.',
                fields: [{ id: 'pair', label: 'Word Pair', type: 'select', options: ['Pen/Pan', 'Pat/Pet', 'Marry/Merry', 'Axe/Ex', 'Al/L'] }]
            },
            'sectG': {
                title: 'Write a letter', shortDesc: 'Handwriting practice', icon: 'fa-pen', color: 'text-orange-500', bg: 'bg-orange-100', type: 'daily', hasTitleSlideOptions: true,
                description: 'This section shows a letter formation slide for students to practice handwriting.',
                fields: [{ id: 'letter', label: 'Target Letter', type: 'text' }]
            },
            'sectH': {
                title: 'Long content', shortDesc: 'Vocabulary or building the field.', icon: 'fa-book', color: 'text-rose-500', bg: 'bg-rose-100', type: 'daily', hasTitleSlideOptions: true,
                description: 'A multi-purpose slide with title, body text and image placeholder to be used to teach or review a concept. Use for reviewing vocab or building the field.',
                fields: [{ id: 'title', label: 'Title', type: 'text' }, { id: 'body', label: 'Body Text', type: 'textarea' }]
            },
            'sectI': {
                title: 'Read the sentence', shortDesc: 'Read a simple sentence', icon: 'fa-glasses', color: 'text-violet-500', bg: 'bg-violet-100', type: 'daily', hasTitleSlideOptions: true,
                description: 'This section shows a simple sentence for students to read. The "Picture" type features a picture placeholder for visual prompt above the sentence. The "Pyramid" type breaks down the sentence into a triangle, adding a word each line.',
                fields: [{ id: 'sent', label: 'Sentence', type: 'text', default: '' }, { id: 'style', label: 'Style', type: 'select', options: ['Picture', 'Pyramid'] }]
            },
            'sectJ': {
                title: 'Sentences', shortDesc: 'Multipurpose sentence slide', icon: 'fa-pen-to-square', color: 'text-fuchsia-500', bg: 'bg-fuchsia-100', type: 'daily', hasTitleSlideOptions: true,
                description: 'This multipurpose section features a simple sentence slide. Use underscores as a "fill the blank" option, e.g. "The ___ sat on ___."',
                fields: [{ id: 'sent', label: 'Sentence', type: 'text' }]
            },
            'sectK': {
                title: 'Label and write a sentence', shortDesc: 'Add labels to picture then write a sentence.', icon: 'fa-tags', color: 'text-sky-500', bg: 'bg-sky-100', type: 'daily', hasTitleSlideOptions: true,
                description: 'This section features a picture placeholder, space to add labels and space to write a sentence. Picture will need to be added in PowerPoint/Google Slides. Prompts below will be inserted in the speaker notes section.',
                fields: [{ id: 'prompt', label: 'Teacher Prompt', type: 'textarea' }]
            },
            'generic': {
                title: 'Generic Section', shortDesc: 'Multipurpose placeholder', icon: 'fa-cube', color: 'text-slate-500', bg: 'bg-slate-200', type: 'daily', hasTitleSlideOptions: true,
                description: 'This section can be used as a placeholder or general purpose slide for sections not included in this builder. Add short text below, include prompt to be inserted in the speakers notes.',
                fields: [{ id: 'word', label: 'Content', type: 'text' }, { id: 'notes', label: 'Speaker\'s notes', type: 'textarea' }]
            },
            'finished': { 
                title: 'Finished', shortDesc: 'A finished slide.', icon: 'fa-flag-checkered', color: 'text-stone-500', bg: 'bg-stone-200', type: 'static',
                description: 'A simple slide to indicate the day\'s set of slides is done.' 
            }
        };

        const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

        let globalSettings = {
            deckName: "Term 1, Week 1 Review",
            preparedBy: "",
            phonicsLevel: "IC11 (sh, ch, tch, th, ck, wh, ng, qu)",
            yearLevel: "Kindergarten",
            term: 1,
            week: 1,
            activeDays: { 'Monday': true, 'Tuesday': true, 'Wednesday': true, 'Thursday': true, 'Friday': true },
            templateId: "12f9hl__t2nghjPeZSO1Ag1P-dLmJXXDKzCSVejT2QbY",
            folderId: "1wbKRkTXB6M6szi-yeCYiU1kyKJgTfIdK"
        };

        let timelineItems = []; 
        let selectedItemId = null;
        let selectedLibraryKey = null;

        const STATE_KEY = 'reviewBuilder_v6_state';

        function saveState() {
            const state = {
                settings: globalSettings,
                timeline: timelineItems
            };
            localStorage.setItem(STATE_KEY, JSON.stringify(state));
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(STATE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.settings) globalSettings = { ...globalSettings, ...parsed.settings };
                    if (parsed.timeline) timelineItems = parsed.timeline;
                    return true;
                }
            } catch (e) {
                console.warn("Could not load state:", e);
            }
            return false;
        }

        function updateLibrarySelection() {
            const items = document.getElementById('library-list').children;
            for (let i = 0; i < items.length; i++) {
                const el = items[i];
                if (el.dataset.key === selectedLibraryKey) {
                    el.classList.add('border-blue-500', 'shadow-md', 'ring-2', 'ring-blue-100');
                    el.classList.remove('border-slate-200');
                } else {
                    el.classList.remove('border-blue-500', 'shadow-md', 'ring-2', 'ring-blue-100');
                    el.classList.add('border-slate-200');
                }
            }
        }

        function init() {
            // Populate Library
            const libraryList = document.getElementById('library-list');
            Object.keys(SECTION_DEFS).forEach(key => {
                const def = SECTION_DEFS[key];
                const el = document.createElement('div');
                el.className = 'p-3 bg-white border border-slate-200 rounded-xl cursor-grab hover:border-blue-300 hover:shadow-sm transition-all flex items-center gap-3 group';
                el.dataset.key = key;
                el.onclick = () => selectItem(key, true);
                el.innerHTML = `
                    <div class="w-8 h-8 rounded-lg ${def.bg} ${def.color} flex items-center justify-center shrink-0">
                        <i class="fa-solid ${def.icon}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-semibold text-slate-700 text-sm group-hover:text-blue-600 transition-colors truncate">${def.title}</div>
                        <div class="text-[10px] text-slate-400 truncate">${def.shortDesc}</div>
                    </div>
                    <i class="fa-solid fa-grip-vertical ml-auto text-slate-300 shrink-0 pl-2"></i>
                `;
                libraryList.appendChild(el);
            });

            // Preload Timeline OR Load State
            if (!loadState()) {
                addTimelineItem('mainIntro');
                addTimelineItem('expectations');
                addTimelineItem('dayDivider');
                addTimelineItem('finished');
            } else {
                document.getElementById('timeline-filename').textContent = globalSettings.deckName;
                renderTimeline();
            }
            
            // Default to having nothing selected so Global Settings are shown on first load
            selectItem(null);

            // Setup Drag and Drop
            new Sortable(libraryList, {
                group: { name: 'shared', pull: 'clone', put: false },
                animation: 150,
                sort: false,
                ghostClass: 'drag-ghost'
            });

            new Sortable(document.getElementById('timeline-list'), {
                group: 'shared',
                animation: 150,
                ghostClass: 'drag-ghost',
                chosenClass: 'drag-chosen',
                onAdd: function (evt) {
                    const key = evt.item.dataset.key;
                    evt.item.remove(); // Remove the DOM element clone
                    addTimelineItem(key, evt.newIndex); // Rebuild via state
                },
                onUpdate: function (evt) {
                    const item = timelineItems.splice(evt.oldIndex, 1)[0];
                    timelineItems.splice(evt.newIndex, 0, item);
                    saveState();
                }
            });

            document.getElementById('timeline-container').addEventListener('click', (e) => {
                if (e.target === document.getElementById('timeline-container') || e.target === document.getElementById('timeline-list')) {
                    selectItem(null);
                }
            });

            document.getElementById('timeline-header').addEventListener('click', () => {
                selectItem(null);
            });

            document.getElementById('btn-reset').addEventListener('click', (e) => {
                e.stopPropagation(); 
                timelineItems = [];
                ['mainIntro', 'expectations', 'dayDivider', 'finished'].forEach(k => addTimelineItem(k));
                selectItem(null);
                saveState();
            });

            document.getElementById('btn-add-all').addEventListener('click', (e) => {
                e.stopPropagation(); 
                timelineItems = [];
                Object.keys(SECTION_DEFS).forEach(k => addTimelineItem(k));
                selectItem(null);
                saveState();
            });

            renderInspector();
        }

        function addTimelineItem(defKey, index = -1) {
            const def = SECTION_DEFS[defKey];
            const newItem = {
                id: 'item_' + Date.now() + Math.floor(Math.random() * 1000),
                defKey: defKey,
                data: {}
            };

            if (def.hasTitleSlideOptions) {
                let defaultTitle = def.title.includes(': ') ? def.title.split(': ')[1] : def.title;
                if (defKey === 'sectH') defaultTitle = 'Vocabulary'; 
                if (defKey === 'sectJ') defaultTitle = 'Finish the sentence';
                
                newItem.data.titleSettings = {
                    include: true,
                    title: defaultTitle,
                    instructions: ''
                };
            }

            const getDefaultValue = (f) => {
                if (f.default !== undefined) return f.default;
                if (f.type === 'select' && f.options && f.options.length > 0) return f.options[0];
                if (f.type === 'checkbox') return false;
                return ''; 
            };

            if (def.type === 'weekly') {
                if (def.fields) {
                    def.fields.forEach(f => { newItem.data[f.id] = getDefaultValue(f); });
                }
            } else if (def.type === 'daily') {
                DAYS.forEach(day => {
                    if (!newItem.data[day]) newItem.data[day] = {};
                    if (def.fields) {
                        def.fields.forEach(f => { newItem.data[day][f.id] = getDefaultValue(f); });
                    }
                });
            } else if (def.type === 'mixed') {
                if (def.weeklyFields) {
                    def.weeklyFields.forEach(f => { newItem.data[f.id] = getDefaultValue(f); });
                }
                if (def.dailyFields) {
                    DAYS.forEach(day => {
                        if (!newItem.data[day]) newItem.data[day] = {};
                        def.dailyFields.forEach(f => { newItem.data[day][f.id] = getDefaultValue(f); });
                    });
                }
            }

            // specific logic overrides
            if (def.type === 'daily' || def.type === 'mixed') {
                DAYS.forEach(day => { 
                    if (!newItem.data[day]) newItem.data[day] = {}; 
                    
                    if (defKey === 'sectF') {
                        const dayDefaults = {
                            'Monday': 'Pen/Pan',
                            'Tuesday': 'Pat/Pet',
                            'Wednesday': 'Marry/Merry',
                            'Thursday': 'Axe/Ex',
                            'Friday': 'Al/L'
                        };
                        newItem.data[day]['pair'] = dayDefaults[day] || 'Pen/Pan';
                    }
                });
            }

            if (index === -1) {
                timelineItems.push(newItem);
            } else {
                timelineItems.splice(index, 0, newItem);
            }

            renderTimeline();
            selectItem(newItem.id);
            saveState();
        }

        function deleteTimelineItem(id) {
            timelineItems = timelineItems.filter(i => i.id !== id);
            if (selectedItemId === id) selectItem(null);
            else renderTimeline();
            saveState();
        }

        function selectItem(id, isLibrary = false) {
            if (isLibrary) {
                selectedLibraryKey = id;
                selectedItemId = null;
            } else {
                selectedItemId = id;
                selectedLibraryKey = null;
            }
            renderTimeline();
            updateLibrarySelection();
            renderInspector();
        }

        function renderTimeline() {
            const list = document.getElementById('timeline-list');
            list.innerHTML = '';

        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);

                array[curId] = array[randId];

            let pyramid = [];
            let currentLine = [];
            for (let i = 0; i < words.length; i++) {
                currentLine.push(words[i]);
                pyramid.push(currentLine.join(' '));
            }
            return pyramid.join('\n');
        }

        document.getElementById('btn-assemble').addEventListener('click', () => {
            const recipe = {
                deckName: globalSettings.deckName,
                author: globalSettings.preparedBy || "",
                templateId: globalSettings.templateId,
                folderId: globalSettings.folderId || null,
                globalTerm: globalSettings.term,
                globalWeek: globalSettings.week,
                globalPhonicsLevel: globalSettings.phonicsLevel,
                slides: []
            };

            const introBlock = timelineItems.find(i => i.defKey === 'mainIntro');
            if (introBlock) {
                recipe.slides.push({
                    noteId: "[mainTitle]",
                    replacements: {
                        "{{yearLevel}}": globalSettings.yearLevel,
                        "{{termNumber}}": globalSettings.term.toString(),
                        "{{weekNumber}}": globalSettings.week.toString()
                    }
                });
            }

            const currentLevelIdx = SOUNDS_WRITE_LEVELS.indexOf(globalSettings.phonicsLevel);
            let fullPool = [];
            let currentLevelGraphemes = [];
            
            for (let i = 0; i <= currentLevelIdx; i++) {
                let levelName = SOUNDS_WRITE_LEVELS[i];
                let graphemes = phonicsData[levelName] || [];
                fullPool = fullPool.concat(graphemes);
                if (i === currentLevelIdx) {
                    currentLevelGraphemes = graphemes;
                }
            }
            const previousLevelGraphemes = fullPool.filter(g => !currentLevelGraphemes.includes(g));

            DAYS.forEach(day => {
                if (!globalSettings.activeDays[day]) return;

                timelineItems.forEach(item => {
                    const def = SECTION_DEFS[item.defKey];
                    const data = item.data;

                    if (item.defKey === 'mainIntro') return; 

                    if (def.hasTitleSlideOptions && data.titleSettings?.include) {
                        recipe.slides.push({
                            noteId: "[sectionTitle]",
                            replacements: {
                                "{{sectionTitle}}": data.titleSettings.title || "",
                                "{{instructions}}": data.titleSettings.instructions || ""
                            }
                        });
                    }

                    if (item.defKey === 'expectations') {
                        const style = data.weekly?.style || data.style || 'Basic';
                        let noteId = "[expectations]";
                        if (style === 'Whiteboards') noteId = "[expectations_wb]";
                        if (style === 'Whiteboards and Music') noteId = "[expectations_wb_music]";
                        recipe.slides.push({ noteId: noteId });
                    }
                    
                    else if (item.defKey === 'dayDivider') {
                        recipe.slides.push({ noteId: `[Days_${day.toLowerCase()}]` });
                    }

                    else if (item.defKey === 'sectA') {
                        recipe.slides.push({
                            noteId: "[pictureTalk_stimulus]",
                            injectNotes: data[day]?.prompt || ""
                        });
                    }

                    else if (item.defKey === 'sectB') {
                        let limitStr = data.weekly?.limit || data.limit;
                        let selectedGraphemes = [];
                        
                        if (limitStr && parseInt(limitStr) > 0) {
                            let limit = parseInt(limitStr);
                            if (currentLevelGraphemes.length >= limit) {
                                selectedGraphemes = shuffleArray([...currentLevelGraphemes]).slice(0, limit);
                            } else {
                                selectedGraphemes = [...currentLevelGraphemes];
                                let remainder = limit - selectedGraphemes.length;
                                let shuffledPrev = shuffleArray([...previousLevelGraphemes]);
                                
                                for (let i = 0; i < remainder; i++) {
                                    selectedGraphemes.push(shuffledPrev[i % (shuffledPrev.length || 1)] || "a"); 
                                }
                            }
                        } else {
                            selectedGraphemes = [...fullPool];
                        }
                        
                        selectedGraphemes = shuffleArray(selectedGraphemes);
                        
                        selectedGraphemes.forEach(gr => {
                            recipe.slides.push({
                                noteId: "[graphemeRead_stimulus]",
                                replacements: { "{{gr}}": gr }
                            });
                        });
                    }

                    else if (item.defKey === 'sectC') {
                        const standardVowels = ['a', 'e', 'i', 'o', 'u'];
                        let poolVowels = fullPool.filter(g => standardVowels.includes(g));
                        let poolConsonants = fullPool.filter(g => !standardVowels.includes(g));
                        
                        if (poolVowels.length === 0) poolVowels = standardVowels;
                        if (poolConsonants.length === 0) poolConsonants = ['b','c','d','f','g','m','s','t']; 
                        
                        const generateLine = () => {
                            let line = [];
                            for (let i = 0; i < 3; i++) line.push(poolVowels[Math.floor(Math.random() * poolVowels.length)]);
                            for (let i = 0; i < 4; i++) line.push(poolConsonants[Math.floor(Math.random() * poolConsonants.length)]);
                            
                            line = shuffleArray(line);
                            return line.map(randomizeCasing).join(" ");
                        };

                        recipe.slides.push({
                            noteId: "[readLines_stimulus]",
                            replacements: {
                                "{{readLines_1}}": generateLine(),
                                "{{readLines_2}}": generateLine()
                            }
                        });
                    }

                    else if (item.defKey === 'sectD') {
                        const wordsStr = data.words || data.weekly?.words || "";
                        let wordsArray = wordsStr.split(",").map(w => w.trim()).filter(w => w);
                        wordsArray = shuffleArray(wordsArray);
                        
                        wordsArray.forEach(w => {
                            recipe.slides.push({
                                noteId: "[heartWords_stimulus]",
                                replacements: { "{{a}}": w }
                            });
                        });

                        const writeIt = data[day]?.writeIt;
                        const writeItWordsStr = data[day]?.writeItWords || "";
                        
                        if (writeIt && writeItWordsStr) {
                            let writeArray = writeItWordsStr.split(",").map(w => w.trim()).filter(w => w);
                            writeArray.forEach(w => {
                                recipe.slides.push({
                                    noteId: "[heartWords_write]",
                                    replacements: { "{{a}}": w }
                                });
                                recipe.slides.push({
                                    noteId: "[heartWords_write_blank]"
                                });
                            });
                        }
                    }

                    else if (item.defKey === 'sectE') {
                        const wordsStr = data[day]?.words || "";
                        let wordsArray = wordsStr.split(",").map(w => w.trim()).filter(w => w);
                        
                        wordsArray.forEach(w => {
                            let isAlien = w.endsWith("*");
                            let cleanWord = isAlien ? w.slice(0, -1) : w;
                            recipe.slides.push({
                                noteId: isAlien ? "[wordReading_alien_stimulus]" : "[wordReading_stimulus]",
                                replacements: { "{{word}}": cleanWord }
                            });
                        });
                    }

                    else if (item.defKey === 'sectF') {
                        recipe.slides.push({ noteId: "[audDiscrim_instruction_ae]" });
                        
                        const pair = data[day]?.pair || "Pen/Pan";
                        const map = {
                            "Pen/Pan": "[audDiscrim_penPan]",
                            "Pat/Pet": "[audDiscrim_patPet]",
                            "Marry/Merry": "[audDiscrim_marryMerry]",
                            "Axe/Ex": "[audDiscrim_axeX]",
                            "Al/L": "[audDiscrim_alL]"
                        };
                        recipe.slides.push({ noteId: map[pair] || "[audDiscrim_penPan]" });
                    }

                    else if (item.defKey === 'sectG') {
                        let letter = data[day]?.letter || "";
                        letter = letter.trim().toLowerCase();
                        if (letter) {
                            recipe.slides.push({ noteId: `[writeLetter_${letter}]` });
                        }
                    }

                    else if (item.defKey === 'sectH') {
                        recipe.slides.push({
                            noteId: "[vocabulary_stimulus]",
                            replacements: {
                                "{{title}}": data[day]?.title || "",
                                "{{body}}": data[day]?.body || ""
                            }
                        });
                    }

                    else if (item.defKey === 'sectI') {
                        let sent = data[day]?.sent || "";
                        let style = data[day]?.style || "Picture";
                        
                        if (style === "Pyramid") {
                            recipe.slides.push({
                                noteId: "[sentenceRead_pyramid_stimulus]",
                                replacements: { "{{sent}}": buildPyramid(sent) }
                            });
                        } else {
                            recipe.slides.push({
                                noteId: "[sentenceRead_pic_stimulus]",
                                replacements: { "{{sent}}": sent }
                            });
                        }
                    }

                    else if (item.defKey === 'sectJ') {
                        recipe.slides.push({
                            noteId: "[finishSentence_stimulus]",
                            replacements: { "{{sent}}": data[day]?.sent || "" }
                        });
                    }

                    else if (item.defKey === 'sectK') {
                        recipe.slides.push({ noteId: "[labelAndSentence_instructions]" });
                        recipe.slides.push({
                            noteId: "[labelAndSentence_stimulus]",
                            injectNotes: data[day]?.prompt || ""
                        });
                    }

                    else if (item.defKey === 'generic') {
                        recipe.slides.push({
                            noteId: "[generic_stimulus]",
                            replacements: { "{{content}}": data[day]?.word || "" },
                            injectNotes: data[day]?.notes || ""
                        });
                    }

                    else if (item.defKey === 'finished') {
                        recipe.slides.push({ noteId: "[finished]" });
                    }
                });
            });

            currentRecipe = recipe;

            const modal = document.getElementById('json-modal');
            const content = document.getElementById('json-modal-content');
            const output = document.getElementById('json-output');
            
            output.textContent = JSON.stringify(recipe, null, 4);
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95', 'opacity-0');
            }, 10);
        });

        document.getElementById('btn-close-modal').addEventListener('click', () => {
            const modal = document.getElementById('json-modal');
            const content = document.getElementById('json-modal-content');
            
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        });

        function openDriveFolder(e) {
            if (globalSettings.folderId) {
                window.open(`https://drive.google.com/drive/folders/${globalSettings.folderId}`, '_blank');
            } else {
                const btn = e.currentTarget;
                const originalHtml = btn.innerHTML;
                const originalClasses = btn.className;
                btn.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Missing Folder ID`;
                btn.classList.add('text-rose-600', 'bg-rose-50', 'border-rose-200');
                btn.classList.remove('text-blue-700', 'text-blue-600');
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.className = originalClasses;
                }, 3000);
            }
        }

        document.getElementById('btn-open-folder-header').addEventListener('click', openDriveFolder);
        document.getElementById('btn-open-folder-modal').addEventListener('click', openDriveFolder);

        document.getElementById('btn-send-api').addEventListener('click', async () => {
            if (!currentRecipe) return;

            const btn = document.getElementById('btn-send-api');
            const status = document.getElementById('api-status');
            
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            status.classList.remove('hidden');
            status.textContent = "Building presentation... (this may take 10-20 seconds)";
            status.className = "text-sm font-semibold text-blue-600 animate-pulse";

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8",
                    },
                    body: JSON.stringify(currentRecipe),
                });

                const result = await response.json();

                if (result.status === "success") {
                    status.textContent = "Success!";
                    status.className = "text-sm font-bold text-emerald-500";
                    btn.innerHTML = `<i class="fa-solid fa-arrow-up-right-from-square"></i> Open Google Slides`;
                    btn.onclick = () => window.open(result.url, '_blank');
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    btn.disabled = false;
                } else {
                    throw new Error(result.message || "Unknown error occurred.");
                }
            } catch (error) {
                console.error("API Error:", error);
                status.textContent = "Error: Check console for details.";
                status.className = "text-sm font-bold text-rose-500";
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        init();
    </script>
</body>
</html>
